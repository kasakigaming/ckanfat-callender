<title>Callender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#FCFAFB;
  --surface:#FFFFFF;
  --surface-2:#F7F2F4;
  --surface-3:#F1E9ED;
  --line:#EDE3E7;
  --line-2:#DFD0D8;
  --ink:#2A1F25;
  --ink-2:#5E4E56;
  --muted:#93818A;
  --accent:#D9558A;
  --accent-ink:#B23A6C;
  --accent-soft:#FBEBF2;
  --accent-line:#F2CFDF;
  --ot:#D93F22;
  --ot-soft:#FDEDE8;
  --ot-line:#F6C9BB;
  --ok:#2E8F61;
  --ok-soft:#E8F4EE;
  --shadow-1:0 1px 2px rgba(42,31,37,.05);
  --shadow-2:0 2px 4px rgba(42,31,37,.05), 0 12px 28px -14px rgba(42,31,37,.28);
  --shadow-3:0 8px 20px -6px rgba(42,31,37,.14), 0 32px 60px -24px rgba(42,31,37,.4);
  --r-xs:7px; --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px;
  --slot:60px;
  --grid:#E3D6DD;
  --sans:"Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#161114;
    --surface:#1D171C;
    --surface-2:#251E24;
    --surface-3:#2E252D;
    --line:#332A32;
    --line-2:#463A44;
    --ink:#F6EDF1;
    --ink-2:#CDBCC5;
    --muted:#9C8792;
    --accent:#EE7BA9;
    --accent-ink:#F6A9C7;
    --accent-soft:#3A2230;
    --accent-line:#50303F;
    --ot:#FF8163;
    --ot-soft:#3D2019;
    --ot-line:#5C3025;
    --ok:#5BC191;
    --ok-soft:#1E2E27;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.8);
    --shadow-3:0 8px 20px -6px rgba(0,0,0,.5), 0 32px 60px -24px rgba(0,0,0,.9);
    --grid:#3A3039;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#161114;
  --surface:#1D171C;
  --surface-2:#251E24;
  --surface-3:#2E252D;
  --line:#332A32;
  --line-2:#463A44;
  --ink:#F6EDF1;
  --ink-2:#CDBCC5;
  --muted:#9C8792;
  --accent:#EE7BA9;
  --accent-ink:#F6A9C7;
  --accent-soft:#3A2230;
  --accent-line:#50303F;
  --ot:#FF8163;
  --ot-soft:#3D2019;
  --ot-line:#5C3025;
  --ok:#5BC191;
  --ok-soft:#1E2E27;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.8);
  --shadow-3:0 8px 20px -6px rgba(0,0,0,.5), 0 32px 60px -24px rgba(0,0,0,.9);
  --grid:#3A3039;
}

*{box-sizing:border-box}
/* Ẩn thanh cuộn hệ thống, vẫn cuộn được bằng con lăn và bàn di. */
.sidebar,.view,.grid-scroll,.mgrid,.modal,.tbl-wrap{scrollbar-width:none; -ms-overflow-style:none}
.sidebar::-webkit-scrollbar,.view::-webkit-scrollbar,.grid-scroll::-webkit-scrollbar,
.mgrid::-webkit-scrollbar,.modal::-webkit-scrollbar,.tbl-wrap::-webkit-scrollbar{width:0; height:0}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none; padding:0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
h1,h2,h3,h4{margin:0; font-weight:600; text-wrap:balance; letter-spacing:-.015em}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.lbl{
  font-family:var(--mono); font-size:10px; font-weight:500;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
}
.hide{display:none !important}

/* ---------- shell ---------- */
.app{display:flex; height:100vh; overflow:hidden}
.sidebar{
  width:236px; flex:0 0 236px; background:var(--surface-2);
  border-right:1px solid var(--line); padding:18px 12px 14px;
  display:flex; flex-direction:column; gap:20px;
  height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:9px; padding:0 6px}
.brand-mark{
  width:28px; height:28px; border-radius:9px; flex:0 0 28px;
  background:var(--accent); color:#fff; display:grid; place-items:center;
  font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:-.04em;
}
.brand b{font-size:14.5px; font-weight:600; letter-spacing:-.02em}
.brand small{display:block; font-size:10.5px; color:var(--muted); line-height:1.2}
.nav{display:flex; flex-direction:column; gap:2px}
.nav button{
  display:flex; align-items:center; gap:9px; width:100%;
  padding:7px 9px; border-radius:var(--r-sm); color:var(--ink-2);
  font-size:13.5px; font-weight:500; text-align:left;
}
.nav button:hover{background:var(--surface-3)}
.nav button[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.nav svg{width:16px; height:16px; flex:0 0 16px; stroke-width:1.7}
.side-group{display:flex; flex-direction:column; gap:7px; padding:0 6px}
.side-group .lbl{padding-left:2px}
.chk{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); cursor:pointer; padding:2px 0}
.chk input{accent-color:var(--accent); width:14px; height:14px; margin:0; cursor:pointer}
.chk .dot{width:8px; height:8px; border-radius:3px; flex:0 0 8px}
.chk span.t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
select.mini,input.mini{
  width:100%; padding:6px 8px; border-radius:var(--r-xs);
  border:1px solid var(--line-2); background:var(--surface); font-size:13px;
}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:8px; padding:0 6px}
.theme-btn{
  display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:var(--r-sm);
  color:var(--muted); font-size:12.5px;
}
.theme-btn:hover{background:var(--surface-3); color:var(--ink-2)}

.main{flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden}
.topbar{
  display:grid; grid-template-columns:1fr auto; gap:10px 14px; align-items:center;
  padding:14px 22px; border-bottom:1px solid var(--line);
  background:var(--surface); position:relative; z-index:20;
}
.topbar h1{font-size:19px; font-weight:600; white-space:nowrap}
/* Hai nhóm trái phải trong một lưới: hết chỗ thì nhóm phải xuống hàng,
   nhóm trái không bao giờ bị ép co làm chữ tràn ra khỏi nút. */
.tb-left,.tb-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap; row-gap:8px}
.tb-left > *,.tb-right > *{flex:none}
.tb-right{justify-self:end}
.navbtns{display:flex; align-items:center; gap:6px; flex:none; min-width:max-content}
/* Đặt sau các quy tắc gốc, nếu đặt trước thì quy tắc gốc ghi đè ngược lại. */
@media (max-width:760px){
  .topbar{grid-template-columns:1fr}
  .tb-right{justify-self:start}
}
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px;
  border-radius:999px; border:1px solid var(--line-2); background:var(--surface);
  font-size:13px; font-weight:500; color:var(--ink-2); box-shadow:var(--shadow-1);
  transition:background .12s, border-color .12s, color .12s;
  /* Nút không bao giờ hẹp hơn chữ của nó: bị bóp thì chữ tràn ra đè nút bên
     cạnh và vùng bấm teo lại gần như không bấm được. */
  white-space:nowrap; flex:0 0 auto; min-width:max-content;
}
.btn:hover{background:var(--surface-2); color:var(--ink)}
.btn svg{width:15px; height:15px; stroke-width:1.8}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink); color:#fff}
.btn.ghost{border-color:transparent; box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--ot); border-color:var(--ot-line)}
.btn.danger:hover{background:var(--ot-soft)}
.btn.icon{padding:6px; width:30px; height:30px; justify-content:center}
.seg{display:inline-flex; background:var(--surface-2); border-radius:999px; padding:3px; gap:2px; border:1px solid var(--line)}
.seg button{padding:4px 13px; border-radius:999px; font-size:12.5px; font-weight:500; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-1)}
.period-label{font-size:14px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; flex:none}
.period-label em{font-style:normal; color:var(--muted); font-weight:400}

.view{padding:22px; flex:1; min-width:0; min-height:0; overflow-y:auto}
.view.cal{padding:0; display:flex; flex-direction:column; overflow:hidden}
.wrap{max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:22px}

/* ---------- week grid ---------- */
.cal-head{
  display:grid; grid-template-columns:58px repeat(7,minmax(0,1fr));
  border-bottom:1px solid var(--grid); background:var(--surface);
  position:relative; z-index:15;
}
.cal-head .corner{
  border-right:1px solid var(--grid); display:flex; align-items:flex-end; justify-content:flex-end;
  padding:0 7px 6px; font-family:var(--mono); font-size:9px; color:var(--muted); letter-spacing:.02em;
}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chips button{
  padding:4px 11px; border-radius:999px; border:1px solid var(--line-2);
  background:var(--surface); font-size:12.5px; color:var(--ink-2);
}
.chips button:hover{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft)}
.hint-note{
  padding:8px 12px; border-radius:var(--r-sm); font-size:12.5px; line-height:1.5;
  background:var(--ot-soft); color:var(--ot); border:1px solid var(--ot-line);
}
.hint-note.mild{background:var(--surface-2); color:var(--ink-2); border-color:var(--line)}
.dcol{
  padding:8px 6px 9px; text-align:center; border-right:1px solid var(--grid);
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
.dcol:last-child{border-right:none}
.dcol .dn{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.dcol .dd{
  font-size:17px; font-weight:600; width:31px; height:31px; border-radius:50%;
  display:grid; place-items:center; font-variant-numeric:tabular-nums; letter-spacing:-.02em;
}
.dcol.today .dd{background:var(--accent); color:#fff}
.dcol.today .dn{color:var(--accent-ink)}
.dcol .hrs{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.dcol .hrs.on{color:var(--accent-ink)}
.dcol.hol .dn{color:var(--ot)}
.dcol .holname{
  font-size:10px; color:var(--ot); font-weight:500; max-width:100%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
/* overflow-anchor: chặn trình duyệt tự kéo lại chỗ cuộn khi lưới được vẽ lại. */
.grid-scroll{flex:1; min-height:0; overflow:auto; overscroll-behavior:contain; overflow-anchor:none}
.grid{display:grid; grid-template-columns:58px repeat(7,minmax(0,1fr)); position:relative; overflow-anchor:none}
.gutter{border-right:1px solid var(--grid); background:var(--surface)}
.gutter .h{height:var(--slot); position:relative}
/* Nhãn giờ canh giữa đúng vạch kẻ, như Google. */
.gutter .h span{
  position:absolute; right:9px; top:0; transform:translateY(-50%);
  font-family:var(--mono); font-size:10.5px; color:var(--muted); white-space:nowrap;
}
.daycol{border-right:1px solid var(--grid); position:relative}
.daycol:last-child{border-right:none}
.slot{height:var(--slot); border-bottom:1px solid var(--grid); cursor:pointer}
.slot:hover{background:var(--accent-soft)}
.nowline{position:absolute; left:0; right:0; height:0; border-top:1.5px solid var(--ot); z-index:6; pointer-events:none}
.nowline::before{content:""; position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:var(--ot)}

.ev{
  position:absolute; border-radius:var(--r-xs); padding:4px 6px 4px 8px;
  background:var(--surface); border:1px solid var(--line-2);
  box-shadow:var(--shadow-1); overflow:hidden; text-align:left;
  display:flex; flex-direction:column; gap:1px; z-index:4;
  transition:box-shadow .12s, transform .12s;
}
.ev::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c,var(--accent))}
.ev:hover{box-shadow:var(--shadow-2); z-index:7}
.ev .t{font-family:var(--mono); font-size:10.5px; color:var(--muted); line-height:1.3}
.ev .n{font-size:12px; font-weight:600; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ev .s{font-size:11px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ev.ot{background:var(--ot-soft); border-color:var(--ot-line)}
.ev.ot::before{background:var(--ot)}
.ev.ot .n{color:var(--ot)}
.ev.ot .t{color:var(--ot)}
.ev.short{flex-direction:row; align-items:baseline; gap:5px; padding-top:2px}
.ev.done .n{text-decoration:line-through; text-decoration-thickness:1px; opacity:.72}
.ev.narrow{padding:3px 4px 3px 7px}
.ev.narrow .t{font-size:9.5px}
.ev.narrow .n{font-size:11px}
.ev.narrow .s{display:none}
.ev.cut{border-bottom-left-radius:0; border-bottom-right-radius:0; border-bottom-style:dashed}
.ev.cont{border-top-left-radius:0; border-top-right-radius:0; border-top-style:dashed; cursor:pointer}
.ev{cursor:grab; touch-action:none; user-select:none}
.ev:active{cursor:grabbing}
.ev.dragging{opacity:.32; box-shadow:none}
.ev-rz{position:absolute; left:0; right:0; bottom:0; height:8px; cursor:ns-resize}
.ev-rz::after{
  content:""; position:absolute; left:50%; bottom:2px; transform:translateX(-50%);
  width:22px; height:2.5px; border-radius:2px; background:currentColor; opacity:0;
}
.ev:hover .ev-rz::after{opacity:.35}
.ghost{
  position:absolute; z-index:12; pointer-events:none; overflow:hidden;
  border-radius:var(--r-xs); background:var(--accent-soft);
  border:1.5px dashed var(--accent); color:var(--accent-ink);
  padding:3px 7px; box-shadow:var(--shadow-2);
}
.ghost b{display:block; font-size:12px; font-weight:600; line-height:1.25}
.ghost span{font-family:var(--mono); font-size:10.5px}
.ghost.ot{background:var(--ot-soft); border-color:var(--ot); color:var(--ot)}
/* Khối tạm giữ lại trên lịch trong lúc bảng nhỏ đang mở. */
.ghost.firm{background:var(--accent); border:1px solid var(--accent); color:#fff}
.ghost.firm span{opacity:.9}

/* ---------- bảng tạo nhanh ---------- */
.quick{
  position:fixed; z-index:70; width:min(342px, calc(100vw - 24px));
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--shadow-3); padding:6px 8px 10px; display:flex; flex-direction:column;
}
.q-h{display:flex; justify-content:flex-end}
.q-x{width:28px; height:28px; border-radius:9px; display:grid; place-items:center; color:var(--muted)}
.q-x:hover{background:var(--surface-2); color:var(--ink)}
.q-x svg{width:15px; height:15px; stroke-width:1.8; fill:none; stroke:currentColor}
.q-title{
  border:none; border-bottom:2px solid var(--line-2); background:none; width:calc(100% - 8px);
  font-size:17px; font-weight:600; padding:2px 10px 8px; margin:0 4px 10px;
}
.q-title::placeholder{color:var(--muted); font-weight:400}
.q-title:focus{outline:none; border-bottom-color:var(--accent)}
.q-row{display:flex; align-items:center; gap:11px; padding:5px 10px; border-radius:var(--r-sm)}
.q-row > svg{width:17px; height:17px; flex:0 0 17px; stroke-width:1.7; fill:none; stroke:var(--muted)}
.q-row .txt b{display:block; font-size:13.5px; font-weight:600}
.q-row .txt span{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
.q-row select{
  flex:1; min-width:0; padding:5px 8px; border-radius:var(--r-xs);
  border:1px solid transparent; background:var(--surface-2); font-size:13.5px;
}
.q-row select:hover{border-color:var(--line-2)}
.q-row select:focus{outline:none; border-color:var(--accent)}
.q-ot{cursor:pointer}
.q-ot > span{flex:1; font-size:13.5px}
.q-ot input{accent-color:var(--ot); width:16px; height:16px; margin:0}
.q-ot:has(input:checked){background:var(--ot-soft)}
.q-ot:has(input:checked) > span{color:var(--ot); font-weight:500}
.q-ot:has(input:checked) > svg{stroke:var(--ot)}
.q-new{display:flex; flex-direction:column; gap:6px; padding:1px 10px 8px 38px}
.q-new input,.q-new select{
  padding:6px 9px; border-radius:var(--r-xs); border:1px solid var(--accent-line);
  background:var(--surface); font-size:13px; width:100%; min-width:0;
}
.q-new input:focus,.q-new select:focus{outline:none; border-color:var(--accent)}
.q-new-r{display:flex; gap:6px}
.q-new-r select{flex:1 1 92px}
.q-new-r input{flex:1 1 80px}
.q-new .btn{flex:0 0 auto; padding:5px 13px; font-size:12.5px}
.q-f{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:10px 4px 0}
.q-f > *{min-width:0; overflow:hidden}
.q-f > *:last-child{justify-self:end}

/* ---------- lịch nhỏ chọn ngày ---------- */
.mc-h{display:flex; align-items:center; gap:2px; padding:0 1px 5px}
.mc-h b{flex:1; font-size:12.5px; font-weight:600; letter-spacing:-.01em}
.mc-h button{width:23px; height:23px; border-radius:7px; display:grid; place-items:center; color:var(--muted)}
.mc-h button:hover{background:var(--surface-3); color:var(--ink)}
.mc-h svg{width:13px; height:13px; stroke-width:2; fill:none; stroke:currentColor}
.mc-g{display:grid; grid-template-columns:repeat(7,1fr); gap:1px}
.mc-g i{
  font-style:normal; font-family:var(--mono); font-size:9px; color:var(--muted);
  text-align:center; padding-bottom:3px; letter-spacing:.04em;
}
.mc-g button{
  height:25px; border-radius:8px; font-size:11.5px; font-variant-numeric:tabular-nums;
  color:var(--ink-2); position:relative; display:grid; place-items:center;
}
.mc-g button:hover{background:var(--surface-3)}
.mc-g button.out{color:var(--muted); opacity:.42}
.mc-g button.has::after{
  content:""; position:absolute; bottom:3px; width:3px; height:3px; border-radius:50%; background:var(--accent);
}
.mc-g button.sel{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.mc-g button.today{background:var(--accent); color:#fff; font-weight:600}
.mc-g button.today.has::after{background:#fff}
.mc-tip{margin:9px 1px 0; font-size:11px; line-height:1.5; color:var(--muted)}

.demo-bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:9px 22px; background:var(--accent-soft);
  border-bottom:1px solid var(--accent-line); color:var(--accent-ink); font-size:12.5px;
}
.demo-bar .spacer{flex:1}
.inline-add{display:flex; gap:6px; flex-wrap:wrap; margin-top:7px}
.inline-add input,.inline-add select{
  padding:7px 10px; border-radius:var(--r-sm); border:1px solid var(--accent-line);
  background:var(--surface); font-size:13.5px; min-width:0; flex:1 1 120px; width:auto;
}
.inline-add select{flex:0 0 132px}
.inline-add input.rate{flex:0 0 118px}
.inline-add .btn{flex:0 0 auto}

/* ---------- month grid ---------- */
.mgrid{
  display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-top:1px solid var(--grid);
  flex:1; min-height:0; overflow-y:auto; align-content:start;
}
.mhead{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); background:var(--surface)}

<script>
/* ============================== tiện ích ============================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const DOW = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
const DOW_LONG = ["Chủ nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu", "Thứ bảy"];
const PALETTE = ["#D9558A", "#6E7BE8", "#2E9E8F", "#E08A2E", "#8A5BD6", "#3F8FD9", "#C2554F", "#4E9B4E"];

const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = d => addDays(d, -((d.getDay() + 6) % 7));            // tuần bắt đầu thứ hai
const startOfMonth = d => new Date(d.getFullYear(), d.getMonth(), 1);
const endOfMonth = d => new Date(d.getFullYear(), d.getMonth() + 1, 0);
const sameDay = (a, b) => iso(a) === iso(b);
const toMin = t => { const [h, m] = String(t || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
const fromMin = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const dur = t => { let a = toMin(t.start), b = toMin(t.end); if (b <= a) b += 1440; return (b - a) / 60; };
const fmtH = h => (Math.round(h * 100) / 100).toString().replace(/\.0+$/, "") + "h";
const vnd = n => new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 0 }).format(Math.round(n || 0)) + " ₫";
const dateVN = d => `${DOW_LONG[d.getDay()]}, ${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
const shortVN = d => `${d.getDate()}/${d.getMonth() + 1}`;

/* ============================== trạng thái ============================== */
const LS = "cakip.v1";
const state = {
  companies: [], people: [], clients: [], tasks: [], holidays: [],
  view: "cal", calMode: "week",
  cursor: new Date(), miniCursor: null,
  me: null,
  hideCo: new Set(), hidePe: new Set(), client: "",
  pay: { kind: "month", n: 1, anchor: iso(new Date()), from: "", to: "", onlyDone: false, group: "person" },
};
let db = null, remote = false;

const co = id => state.companies.find(c => c.id === id);
const pe = id => state.people.find(p => p.id === id);
const cl = id => state.clients.find(c => c.id === id);
const coName = id => (co(id) || {}).name || "Chưa gán công ty";
const coColor = id => (co(id) || {}).color || "#93818A";
const peName = id => (pe(id) || {}).name || "Chưa gán người";

function visible(t) {
  if (state.hideCo.has(t.companyId)) return false;
  if (state.hidePe.has(t.personId)) return false;
  if (state.client && t.clientId !== state.client) return false;
  return true;
}
const tasksOn = (d, all) => state.tasks
  .filter(t => t.date === iso(d) && (all || visible(t)))
  .sort((a, b) => toMin(a.start) - toMin(b.start));

function statusOf(t) {
  if (t.done) return { k: "done", label: "Hoàn thành", cls: "ok" };
  const now = new Date(), day = parseISO(t.date);
  const s = new Date(day); s.setMinutes(toMin(t.start));
  const e = new Date(day); e.setMinutes(toMin(t.end) <= toMin(t.start) ? toMin(t.end) + 1440 : toMin(t.end));
  if (now >= s && now <= e) return { k: "live", label: "Đang làm", cls: "live" };
  if (now > e) return { k: "past", label: "Chưa đánh dấu xong", cls: "" };
  return { k: "next", label: "Sắp làm", cls: "" };
}

/* ============================== lưu trữ ============================== */
const COLLS = ["companies", "people", "clients", "tasks", "holidays"];
function saveLocal() {
  try {
    localStorage.setItem(LS, JSON.stringify({
      companies: state.companies, people: state.people, clients: state.clients, tasks: state.tasks,
    }));
  } catch (e) { /* chế độ riêng tư: bỏ qua */ }
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(LS); if (!raw) return false;
    const d = JSON.parse(raw);
    COLLS.forEach(k => { if (Array.isArray(d[k])) state[k] = d[k]; });
    return true;
  } catch (e) { return false; }
}
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(LS + ".prefs") || "{}");
    if (p.me) state.me = p.me;
    if (p.theme) document.documentElement.setAttribute("data-theme", p.theme);
    if (p.calMode) state.calMode = p.calMode;
    if (p.pay) Object.assign(state.pay, p.pay);
  } catch (e) { }
}
function savePrefs() {
  try {
    localStorage.setItem(LS + ".prefs", JSON.stringify({
      me: state.me, theme: document.documentElement.getAttribute("data-theme"),
      calMode: state.calMode, pay: state.pay,
    }));
  } catch (e) { }
}

function put(coll, obj) {
  if (!obj.id) obj.id = uid();
  const arr = state[coll], i = arr.findIndex(x => x.id === obj.id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
  render();
  if (remote) { const { id, ...body } = obj; db.collection(coll).doc(id).set(body).catch(dbErr); }
  else saveLocal();
  return obj;
}
function drop(coll, id) {
  state[coll] = state[coll].filter(x => x.id !== id);
  render();
  if (remote) db.collection(coll).doc(id).delete().catch(dbErr);
  else saveLocal();
}
function dbErr(e) {
  const msg = e && e.code === "quota_exceeded"
    ? "Kho dữ liệu đã đầy. Xoá bớt nhiệm vụ cũ rồi lưu lại."
    : "Chưa lưu được lên máy chủ. Thay đổi vẫn giữ trên máy này.";
  setStatus(false, msg);
  saveLocal();
}
function setStatus(ok, txt) {
  const el = $("#status"); if (!el) return;
  el.innerHTML = `<i class="dot ${ok ? "" : "off"}"></i><span>${esc(txt)}</span>`;
}

async function initStore() {
  loadPrefs();
  const had = loadLocal();
  render();
  let cap = null;
  try { cap = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { cap = null; }
  if (!cap) {
    setStatus(false, had ? "Lưu trên máy này" : "Lưu trên máy này");
    if (!state.companies.length) seedIfEmpty();
    return;
  }
  db = cap; remote = true;
  setStatus(true, "Đã đồng bộ");
  COLLS.forEach(c => {
    db.collection(c).onSnapshot(snap => {
      state[c] = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      saveLocal();
      render();
    }, e => { remote = false; setStatus(false, "Mất kết nối, đang dùng bản trên máy"); });
  });
}

function periodLabel() {

  if (state.calMode === "month") return `Tháng ${c.getMonth() + 1}, ${c.getFullYear()}`;
  const a = startOfWeek(c), b = addDays(a, 6);
  return `${shortVN(a)} – ${shortVN(b)}/${b.getFullYear()}`;
}
function step(dir) {
  if (dayish()) state.cursor = addDays(state.cursor, dir);
  else if (state.calMode === "month") state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth() + dir, 1);
  else state.cursor = addDays(state.cursor, dir * 7);
  state.miniCursor = startOfMonth(state.cursor);
  render();
}

/* ============================== lịch ngày / tuần ============================== */
// Chiều cao một giờ lấy thẳng từ biến CSS nên hai bên không bao giờ lệch nhau.
const SLOT = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--slot")) || 60;
const SNAP = 15;
let gridLo = 420;   // phút của dòng giờ đầu tiên đang hiển thị

function gridDays() {
  if (state.calMode === "day") return [new Date(state.cursor)];
  const a = startOfWeek(state.cursor);
  return Array.from({ length: 7 }, (_, i) => addDays(a, i));
}
// Các khối vẽ trong một cột ngày. Nhiệm vụ qua đêm cắt làm hai:
// phần đầu chạy tới nửa đêm, phần đuôi nằm ở đầu cột ngày hôm sau.
function segmentsOn(d) {
  const out = [], key = iso(d), prev = iso(addDays(d, -1));
  state.tasks.forEach(t => {
    if (!visible(t)) return;
    const s = toMin(t.start), e = toMin(t.end), overnight = e <= s;
    if (t.date === key) out.push({ t, s, e: overnight ? 1440 : Math.max(e, s + 15), cut: overnight, cont: false });
    else if (overnight && t.date === prev && e > 0) out.push({ t, s: 0, e: Math.max(e, 15), cut: false, cont: true });
  });
  // Cùng giờ bắt đầu thì việc dài hơn đứng trước, giống cách Google xếp.
  return out.sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
}

function renderCalendar() {
  const month = state.calMode === "month";
  $("#calHead").classList.toggle("hide", month);
  $("#gridScroll").classList.toggle("hide", month);
  $("#mHead").classList.toggle("hide", !month);
  $("#mGrid").classList.toggle("hide", !month);
  $$("#calMode button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === state.calMode)));
  month ? renderMonth() : renderTimeGrid();
}

let lastGridKey = "";
function renderTimeGrid() {
  const days = gridDays(), today = new Date();
  const lo = 0, hi = 1440, rows = 24;   // trọn ngày như Google, nhãn 0h ẩn ở mép trên
  gridLo = lo;
  const cols = `58px repeat(${days.length}, minmax(0,1fr))`;
  $("#calHead").style.gridTemplateColumns = cols;
  $("#grid").style.gridTemplateColumns = cols;

  const off = -new Date().getTimezoneOffset() / 60;
  const tz = `GMT${off < 0 ? "−" : "+"}${pad(Math.floor(Math.abs(off)))}`;
  $("#calHead").innerHTML = `<div class="corner">${tz}</div>` + days.map(d => {
    const ts = tasksOn(d), h = ts.reduce((s, t) => s + dur(t), 0), hol = holidayOn(iso(d));
    return `<div class="dcol ${sameDay(d, today) ? "today" : ""} ${hol ? "hol" : ""}">
      <div class="dn">${days.length === 1 ? DOW_LONG[d.getDay()] : DOW[d.getDay()]}</div>
      <div class="dd">${d.getDate()}</div>
      ${hol ? `<div class="holname" title="${esc(hol.name)}">${esc(hol.name)}</div>`
        : `<div class="hrs ${h ? "on" : ""}">${h ? fmtH(h) : "&nbsp;"}</div>`}
    </div>`;
  }).join("");

  // Nhãn giờ nằm ở mép trên mỗi dòng; mép 0h và mép 24h không có nhãn.
  let html = `<div class="gutter">` + Array.from({ length: rows }, (_, r) =>
    `<div class="h">${r === 0 ? "" : `<span>${pad(r)}:00</span>`}</div>`).join("") + `</div>`;

  days.forEach(d => {
    html += `<div class="daycol" data-date="${iso(d)}">`;
    html += Array.from({ length: rows }, (_, r) => `<div class="slot" data-min="${r * 60}"></div>`).join("");
    if (sameDay(d, today)) {
      const m = today.getHours() * 60 + today.getMinutes();
      html += `<div class="nowline" style="top:${m / 60 * SLOT}px"></div>`;
    }
    html += layoutDay(segmentsOn(d), lo);
    html += `</div>`;
  });
  $("#grid").innerHTML = html;
  repaintPending();   // khối tạm của bảng tạo nhanh không bị mất khi lưới vẽ lại

  // Đổi ngày hoặc đổi kiểu xem thì về đúng mốc 0h ở đầu lưới.
  // Vẽ lại trong cùng một tuần thì giữ nguyên chỗ đang xem.
  const key = state.calMode + "|" + iso(days[0]);
  if (key !== lastGridKey) {
    lastGridKey = key;
    const gs = $("#gridScroll");
    gs.scrollTop = 0;
    // Trình duyệt khôi phục chỗ cuộn cũ sau khi dựng xong, nên đặt lại lần nữa.
    requestAnimationFrame(() => { if (lastGridKey === key) gs.scrollTop = 0; });
  }
}

// Xếp chồng kiểu Google Calendar: chia cột trong từng cụm dính nhau,
// rồi nới mỗi nhiệm vụ sang phải hết mức còn trống nên nhìn ra bậc thang.
function layoutDay(segs, lo) {
  const items = segs.map(g => Object.assign({}, g));
  const clusters = [];
  let cur = [], curEnd = -1;
  items.forEach(it => {
    if (cur.length && it.s >= curEnd) { clusters.push(cur); cur = []; curEnd = -1; }
    cur.push(it); curEnd = Math.max(curEnd, it.e);
  });
  if (cur.length) clusters.push(cur);

  // Chia cột thật: mỗi nhiệm vụ trùng giờ có cột riêng, không khối nào đè lên
  // khối nào, nên tên của mọi nhiệm vụ đều đọc được. Khối nào có cột bên phải
  // trống suốt khoảng giờ của nó thì nới rộng ra cho đỡ phí chỗ.
  const GAP = Math.ceil(40 / SLOT * 60);   // số phút tối thiểu để đè mà không nuốt tên
  const STEP = 7, MIN_W = 22;              // nấc thụt và bề ngang tối thiểu, theo %
  const laid = [];
  clusters.forEach(cluster => {
    const placed = [];
    cluster.forEach((it, i) => {
      it.z = 4 + i;
      const over = placed.filter(p => p.s < it.e && it.s < p.e);
      if (!over.length) { it.left = 0; it.right = 100; return placed.push(it); }
      const p = over.reduce((a, b) => (b.left > a.left ? b : a));
      if (it.s - p.s >= GAP && p.left + STEP + MIN_W <= 100) {
        // Bắt đầu muộn hơn đủ xa: thụt một nấc rồi đè, tên khối dưới nằm phía trên.
        it.left = p.left + STEP; it.right = 100;
      } else {
        // Bắt đầu quá sát: tách ngang và cắt bề ngang những khối sắp bị che tên.
        it.left = Math.min(Math.max(p.left + MIN_W, (p.left + 100) / 2), 100 - MIN_W);
        it.right = 100;
        over.forEach(b => { if (it.s - b.s < GAP) b.right = Math.min(b.right, it.left); });
      }
      placed.push(it);
    });
    laid.push(...cluster);
  });

  return laid.map(it => {
    const t = it.t, st = statusOf(t);
    const left = it.left, width = it.right - it.left;
    const top = (it.s - lo) / 60 * SLOT, h = (it.e - it.s) / 60 * SLOT - 3;
    const time = it.cont ? `00:00 – ${t.end} · tiếp` : `${t.start}${h >= 40 ? " – " + t.end : ""}${t.overtime ? " · Tăng ca" : ""}`;
    return `<button class="ev ${t.overtime ? "ot" : ""} ${h < 40 ? "short" : ""} ${t.done ? "done" : ""} ${it.cut ? "cut" : ""} ${it.cont ? "cont" : ""} ${width < 34 ? "narrow" : ""}"
      data-task="${t.id}" ${it.cont ? 'data-cont="1"' : ""}
      style="--c:${coColor(t.companyId)};z-index:${it.z};top:${top}px;height:${Math.max(h, 21)}px;left:calc(${left}% + 2px);width:calc(${width}% - 5px)">
      <div class="t">${time}</div>
      <div class="n">${esc(coName(t.companyId))}</div>
      ${h >= 62 ? `<div class="s">${esc(t.title || "")}${st.k === "live" ? " · đang làm" : ""}</div>` : ""}
      ${it.cont ? "" : `<div class="ev-rz" aria-hidden="true"></div>`}
    </button>`;
  }).join("");
}

/* ---------- kéo thả: tạo mới, dời chỗ, đổi thời lượng ---------- */
let drag = null, swallowClick = false;
const snapMin = m => Math.max(0, Math.min(1440, Math.round(m / SNAP) * SNAP));

function colAt(x, y) {
  for (const el of document.elementsFromPoint(x, y)) {
    const c = el.closest && el.closest(".daycol");
    if (c) return c;
  }
  return null;
}
function minAt(col, y) {
  return gridLo + (y - col.getBoundingClientRect().top) / SLOT * 60;
}
function paintGhost(col, s, e, ot, label, firm) {
  let g = $("#ghost");
  if (!g) { g = document.createElement("div"); g.id = "ghost"; $("#grid").appendChild(g); }
  g.className = "ghost" + (ot ? " ot" : "") + (firm ? " firm" : "");
  g.style.left = (col.offsetLeft + 2) + "px";
  g.style.width = Math.max(col.offsetWidth - 6, 40) + "px";
  g.style.top = (s - gridLo) / 60 * SLOT + "px";
  g.style.height = Math.max((e - s) / 60 * SLOT - 2, 19) + "px";
  g.innerHTML = `<b>${esc(label)}</b><span>${fromMin(s)} – ${fromMin(e)} · ${fmtH((e - s) / 60)}</span>`;
}
const clearGhost = () => { const g = $("#ghost"); if (g) g.remove(); };

function onDown(e) {
  if (e.button !== 0) return;
  swallowClick = false;
  const col = e.target.closest(".daycol"); if (!col) return;
  const evEl = e.target.closest(".ev");
  const onHandle = !!e.target.closest(".ev-rz");
  const m = minAt(col, e.clientY);
  if (evEl) {
    const t = state.tasks.find(x => x.id === evEl.dataset.task); if (!t) return;
    // Phần đuôi của nhiệm vụ qua đêm chỉ để bấm xem, kéo thì sửa ở khối gốc.
    if (evEl.dataset.cont) { drag = { mode: "open", t, col }; }
    else {
      let s = toMin(t.start), en = toMin(t.end); if (en <= s) en = 1440;
      drag = { mode: onHandle ? "resize" : "move", t, el: evEl, col, date: t.date, s, e: en, grab: m - s };
    }
  } else {
    const a = snapMin(m);
    drag = { mode: "create", col, date: col.dataset.date, anchor: a, s: a, e: Math.min(a + SNAP, 1440) };
  }
  drag.moved = false; drag.x0 = e.clientX; drag.y0 = e.clientY;
  try { $("#grid").setPointerCapture(e.pointerId); } catch (err) { }
  e.preventDefault();
}

function onMove(e) {
  if (!drag || drag.mode === "open") return;
  if (!drag.moved) {
    if (Math.abs(e.clientX - drag.x0) < 4 && Math.abs(e.clientY - drag.y0) < 4) return;
    drag.moved = true;
    if (drag.el) drag.el.classList.add("dragging");
  }
  if (drag.mode === "move") {
    const col = colAt(e.clientX, e.clientY) || drag.col;
    drag.col = col; drag.date = col.dataset.date;
    const len = drag.e - drag.s;
    let s = snapMin(minAt(col, e.clientY) - drag.grab);
    s = Math.max(0, Math.min(s, 1440 - len));
    drag.s = s; drag.e = s + len;
  } else if (drag.mode === "resize") {
    drag.e = Math.max(drag.s + SNAP, snapMin(minAt(drag.col, e.clientY)));
  } else {
    const m = snapMin(minAt(drag.col, e.clientY));
    drag.s = Math.min(drag.anchor, m);
    drag.e = Math.max(drag.anchor + SNAP, m);
  }
  paintGhost(drag.col, drag.s, drag.e, drag.t ? drag.t.overtime : false,
    drag.t ? (coName(drag.t.companyId)) : "Nhiệm vụ mới");
}

// Cuộn bằng ngón tay làm trình duyệt huỷ thao tác kéo: bỏ qua, không mở hộp thoại.
function onCancel() {
  if (!drag) return;
  if (drag.el) drag.el.classList.remove("dragging");
  drag = null; clearGhost();
}

function onUp(e) {
  if (!drag) return;
  const d = drag; drag = null;
  clearGhost();
  if (d.el) d.el.classList.remove("dragging");
  swallowClick = true;
  if (d.mode === "create") {
    startQuickCreate(d.date, d.moved ? d.s : d.anchor, d.moved ? d.e : Math.min(d.anchor + 60, 1440));
    return;
  }
  if (!d.moved) { openTask(Object.assign({}, d.t)); return; }
  put("tasks", Object.assign({}, d.t, { date: d.date, start: fromMin(d.s), end: fromMin(d.e) }));
}

/* ---------- bảng tạo nhanh, khối tạm vẫn nằm trên lịch ---------- */
let pending = null, quickEl = null;

function repaintPending() {
  if (!pending) return;
  const col = $(`.daycol[data-date="${pending.date}"]`);
  if (!col) { closeQuick(); return; }
  paintGhost(col, pending.s, pending.e, false, "(Chưa đặt tên)", true);
}
function quickOutside(e) {
  if (quickEl && !e.target.closest(".quick") && !e.target.closest(".scrim")) closeQuick();
}
function closeQuick(keepGhost) {
  if (quickEl) { quickEl.remove(); quickEl = null; }
  document.removeEventListener("pointerdown", quickOutside, true);
  if (!keepGhost) { pending = null; clearGhost(); }
}
function startQuickCreate(date, s, e) {
  pending = { date, s, e };
  repaintPending();
  const g = $("#ghost");
  openQuick({ date, start: fromMin(s), end: fromMin(e) },
    g ? g.getBoundingClientRect() : { left: innerWidth / 2, right: innerWidth / 2, top: 140 });
}

/* ============================== tính lương ============================== */
function payRange() {
  const p = state.pay, a = parseISO(p.anchor);
  if (p.kind === "custom") {
    const f = p.from ? parseISO(p.from) : startOfMonth(a);
    const t = p.to ? parseISO(p.to) : endOfMonth(a);
    return { from: f, to: t, label: `${shortVN(f)} – ${shortVN(t)}/${t.getFullYear()}` };
  }
  if (p.kind === "week") {
    const f = startOfWeek(a), t = addDays(f, 7 * Math.max(1, p.n) - 1);
    return { from: f, to: t, label: `${p.n} tuần · ${shortVN(f)} – ${shortVN(t)}/${t.getFullYear()}` };
  }
  if (p.kind === "month") {
    const f = new Date(a.getFullYear(), a.getMonth(), 1);
    const t = new Date(a.getFullYear(), a.getMonth() + Math.max(1, p.n), 0);
    return { from: f, to: t, label: p.n > 1 ? `${p.n} tháng · ${shortVN(f)} – ${shortVN(t)}/${t.getFullYear()}` : `Tháng ${f.getMonth() + 1}/${f.getFullYear()}` };
  }
  const f = new Date(a.getFullYear(), 0, 1), t = new Date(a.getFullYear() + Math.max(1, p.n) - 1, 11, 31);
  return { from: f, to: t, label: p.n > 1 ? `${f.getFullYear()} – ${t.getFullYear()}` : `Năm ${f.getFullYear()}` };
}
// Số tháng của kỳ, tính theo tỉ lệ ngày: trọn tháng 8 được 1, nửa tháng được 0,5.
function monthsBetween(f, t) {
  let total = 0, cur = new Date(f.getFullYear(), f.getMonth(), 1);
  while (cur <= t) {
    const last = endOfMonth(cur);
    const a = cur > f ? cur : f, b = last < t ? last : t;
    total += (Math.round((b - a) / 864e5) + 1) / last.getDate();
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }
  return Math.round(total * 1000) / 1000;
}

/* ---- loại ngày, giờ đêm, hệ số ---- */
const PCT = { ot: 1.5, week: 2, hol: 3, night: .3 };   // mức tối thiểu theo luật
const holidayOn = date => state.holidays.find(h => h.date === date);
const DAYNAME = { normal: "Ngày thường", weekend: "Ngày nghỉ tuần", holiday: "Ngày lễ" };

function dayTypeOf(t) {
  if (t.dayType) return t.dayType;                 // bạn chọn tay thì theo bạn
  if (holidayOn(t.date)) return "holiday";
  const d = parseISO(t.date).getDay();
  return d === 0 || d === 6 ? "weekend" : "normal";
}
// Số giờ thực sự nằm trong khung ban đêm 22:00 – 06:00.
function nightHours(t) {
  let s = toMin(t.start), e = toMin(t.end); if (e <= s) e += 1440;
  let n = 0;
  for (let base = -1440; base <= 1440; base += 1440) {
    n += Math.max(0, Math.min(e, base + 30 * 60) - Math.max(s, base + 22 * 60));
  }
  return n / 60;
}
const hourlyOf = c => c.mode === "hour" ? c.rate
  : c.mode === "day" ? c.rate / (c.hpd || 8)
    : c.rate / (22 * (c.hpd || 8));
function multOf(t, c) {
  const k = dayTypeOf(t);
  if (k === "holiday") return c.otHol || PCT.hol;
  if (k === "weekend") return c.otWeek || PCT.week;
  return t.overtime ? (c.ot || PCT.ot) : 1;
}

// Thù lao của một nhiệm vụ. Giờ được nhân hệ số thì trả theo giờ; giờ thường
// của công ty trả theo ngày hoặc theo tháng đã nằm trong lương ngày, lương tháng.
function payOf(t) {
  const c = co(t.companyId), h = dur(t), k = dayTypeOf(t), night = nightHours(t);
  if (!c) return { h, k, mult: 1, base: h, otH: 0, holH: 0, night, amount: 0 };
  const mult = multOf(t, c), hourly = hourlyOf(c);
  const nightPct = c.otNight === undefined ? PCT.night : c.otNight;
  let amount = 0;
  if (c.mode === "hour") amount = h * hourly * mult;
  else if (mult > 1) amount = h * hourly * mult;
  amount += night * hourly * nightPct;
  return {
    h, k, mult, night, amount,
    base: mult === 1 ? h : 0,
    otH: mult > 1 && k === "normal" ? h : 0,
    holH: mult > 1 && k !== "normal" ? h : 0,
  };
}

function payrollRows() {
  const { from, to } = payRange();
  const f = iso(from), t = iso(to);
  const sel = state.tasks.filter(x => x.date >= f && x.date <= t && visible(x) && (!state.pay.onlyDone || x.done));
  const key = x => state.pay.group === "person" ? `${x.personId}|${x.companyId}` : `${x.companyId}|${x.personId}`;
  const map = new Map();
  sel.forEach(x => {
    const k = key(x);
    if (!map.has(k)) map.set(k, {
      personId: x.personId, companyId: x.companyId, h: 0, base: 0, otH: 0, holH: 0,
      night: 0, days: new Set(), payDays: new Set(), n: 0, amount: 0,
    });
    const r = map.get(k), p = payOf(x);
    r.h += p.h; r.base += p.base; r.otH += p.otH; r.holH += p.holH; r.night += p.night;
    r.n++; r.days.add(x.date);
    // Chỉ ngày có giờ thường mới được tính một ngày công; ngày chỉ có tăng ca
    // hay ngày lễ đã trả theo giờ rồi, tính thêm ngày công nữa là trả hai lần.
    if (p.base > 0) r.payDays.add(x.date);
    r.amount += p.amount;
  });
  const months = monthsBetween(from, to);
  const rows = Array.from(map.values());
  rows.forEach(r => {
    const c = co(r.companyId);
    if (!c) { r.basis = "Chưa gán công ty"; return; }
    if (c.mode === "hour") { r.basis = `${vnd(c.rate)}/giờ`; }
    else if (c.mode === "day") { r.amount += r.payDays.size * c.rate; r.basis = `${vnd(c.rate)}/ngày công`; }
    else {
      // Lương cố định chia đều cho những người có nhiệm vụ ở công ty đó trong kỳ.
      const heads = new Set(rows.filter(o => o.companyId === r.companyId).map(o => o.personId)).size || 1;
      r.amount += (c.rate * months) / heads;
      r.basis = `${vnd(c.rate)}/tháng` + (months !== 1 ? ` × ${months} tháng` : "") + (heads > 1 ? ` · chia ${heads} người` : "");
    }
  });
  return { rows: rows.sort((a, b) => b.amount - a.amount), from, to, months, count: sel.length };
}

          <div class="f"><label>Số buổi</label><input type="number" id="tRepN" min="1" max="60" value="5" disabled></div>
        </div>` : ""}
        <label class="chk" style="font-size:13.5px"><input type="checkbox" id="tDone" ${t.done ? "checked" : ""}>Đã hoàn thành</label>
      </div>
      <div class="modal-f">
        ${isNew ? `<span></span>` : `<button class="btn danger" id="mDel">Xoá nhiệm vụ</button>`}
        <button class="btn primary" id="mSave">${isNew ? "Tạo nhiệm vụ" : "Lưu thay đổi"}</button>
      </div>
    </div>
  </div>`;

  const upd = () => {
    const sv = $("#tStart").value, evv = $("#tEnd").value;
    if (!sv || !evv) return;
    const h = dur({ start: sv, end: evv });
    $("#tDur").textContent = fmtH(h);
    const overnight = toMin(evv) <= toMin(sv);
    $("#tDurTxt").textContent = overnight ? "Kết thúc sang ngày hôm sau"
      : h > 8 ? "Dài hơn một ca chuẩn tám tiếng" : "Thời gian làm việc";

    const hints = [];
    const pid = $("#tPe").value, date = $("#tDate").value;
    if (pid && pid !== "__new" && date) {
      const s0 = toMin(sv); let e0 = toMin(evv); if (e0 <= s0) e0 += 1440;
      const clash = state.tasks.filter(x => x.id !== t.id && x.date === date && x.personId === pid)
        .filter(x => { let a = toMin(x.start), b = toMin(x.end); if (b <= a) b += 1440; return a < e0 && s0 < b; });
      if (clash.length) hints.push(["", `Trùng giờ với ${clash.map(x => esc(x.title || "nhiệm vụ") + ` ${x.start}–${x.end}`).join(", ")}. Phần giờ trùng sẽ bị cộng hai lần khi tính lương.`]);
    }
    // Loại ngày và phần trăm đang áp dụng
    const cid = $("#tCo").value;
    const probe = { date, start: sv, end: evv, overtime: $("#tOt").checked, dayType: $("#tDay").value };
    const kind = dayTypeOf(probe), nh = nightHours(probe);
    const cc = cid && cid !== "__new" ? co(cid) : null;
    if (cc) {
      const m = Math.round(multOf(probe, cc) * 100);
      const np = Math.round((cc.otNight === undefined ? PCT.night : cc.otNight) * 100);
      const hol = holidayOn(date);
      let msg = `${DAYNAME[kind]}${hol && !probe.dayType ? ` · ${esc(hol.name)}` : ""} · trả ${m}% lương giờ`;
      if (nh) msg += `, trong đó ${fmtH(nh)} ban đêm được cộng thêm ${np}%`;
      hints.push([m > 100 || nh ? "" : "mild", msg]);
    } else hints.push(["mild", "Chưa gán công ty nên nhiệm vụ này chỉ cộng giờ, không ra tiền."]);
    $("#tHints").innerHTML = hints.map(([k, m]) => `<div class="hint-note ${k}">${m}</div>`).join("");
  };

  // Dời giờ bắt đầu thì giữ nguyên thời lượng, giống Google.
  let lastStart = $("#tStart").value;
  $("#tStart").addEventListener("change", () => {
    const ns = $("#tStart").value;
    if (ns) {
      const os = toMin(lastStart);
      let e0 = toMin($("#tEnd").value); if (e0 <= os) e0 += 1440;
      $("#tEnd").value = fromMin((toMin(ns) + (e0 - os)) % 1440);
      lastStart = ns;
    }
    upd();
  });
  $("#tEnd").addEventListener("change", upd);
  $("#tStart").addEventListener("input", upd);
  $("#tEnd").addEventListener("input", upd);
  ["tDate", "tPe", "tCo", "tDay", "tOt"].forEach(id => $("#" + id).addEventListener("change", upd));
  $("#tQuick").addEventListener("click", e => {
    const b = e.target.closest("[data-h]"); if (!b) return;
    $("#tEnd").value = fromMin((toMin($("#tStart").value) + Math.round(Number(b.dataset.h) * 60)) % 1440);
    lastStart = $("#tStart").value;
    upd();
  });
  $("#tOt").addEventListener("change", e => $("#tNoteWrap").classList.toggle("hide", !e.target.checked));
  if (isNew) $("#tRep").addEventListener("change", e => { $("#tRepN").disabled = !e.target.value; });
  upd();
  setTimeout(() => $("#tTitle").focus(), 30);

  // Thêm thẳng công ty / khách hàng / người làm ngay trong hộp thoại,
  // khỏi phải rời sang màn hình Thiết lập.
  const refill = (sel, coll, label, keep) => {
    sel.innerHTML = `<option value="">— chưa gán —</option>` +
      state[coll].map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join("") +
      `<option value="__new">+ ${label}</option>`;
    sel.value = keep || "";
  };
  const wire = (selId, boxId, create) => {
    const sel = $("#" + selId), box = $("#" + boxId);
    sel.addEventListener("change", () => {
      const open = sel.value === "__new";
      box.classList.toggle("hide", !open);
      if (open) $("input.nm", box).focus();
    });
    const go = () => {
      const nm = $("input.nm", box);
      if (!nm.value.trim()) return nm.focus();
      create(box, nm.value.trim());
      box.classList.add("hide");
      $$("input", box).forEach(i => { i.value = ""; });
    };
    $("button", box).addEventListener("click", go);
    $$("input", box).forEach(i => i.addEventListener("keydown", ev => {
      if (ev.key === "Enter") { ev.preventDefault(); go(); }
    }));
  };

  wire("tCo", "coNew", (box, name) => {
    const o = put("companies", {
      name, mode: $("select", box).value, rate: Number($("input.rate", box).value) || 0,
      ot: 1.5, hpd: 8, color: PALETTE[state.companies.length % PALETTE.length],
    });
    refill($("#tCo"), "companies", "Thêm công ty mới…", o.id);
  });
  wire("tCl", "clNew", (box, name) => {
    const cur = $("#tCo").value;
    const o = put("clients", { name, companyId: cur === "__new" ? "" : cur });
    refill($("#tCl"), "clients", "Thêm khách hàng mới…", o.id);
  });
  wire("tPe", "peNew", (box, name) => {
    const o = put("people", { name, color: PALETTE[(state.people.length + 2) % PALETTE.length] });
    refill($("#tPe"), "people", "Thêm người làm mới…", o.id);
  });

  const close = () => { host.innerHTML = ""; };
  $("#mClose").onclick = close;   // đóng bằng dấu X, phím Esc hoặc bấm ra ngoài
  $("#scrim").onclick = e => { if (e.target.id === "scrim") close(); };
  document.addEventListener("keydown", function onEsc(e) {
    if (e.key === "Escape") { close(); document.removeEventListener("keydown", onEsc); }
  });
  if (!isNew) $("#mDel").onclick = () => {
    askConfirm("Xoá nhiệm vụ", `Xoá "${t.title || "nhiệm vụ"}" ngày ${t.date}? Không lấy lại được.`, "Xoá nhiệm vụ")
      .then(ok => { if (ok) { drop("tasks", t.id); close(); } });
  };
  $("#mSave").onclick = () => {
    const ot = $("#tOt").checked;
    const pick = id => { const v = $(id).value; return v === "__new" ? "" : v; };
    const base = Object.assign({}, t, {
      title: $("#tTitle").value.trim() || "Nhiệm vụ",
      date: $("#tDate").value, start: $("#tStart").value, end: $("#tEnd").value,
      companyId: pick("#tCo"), clientId: pick("#tCl"), personId: pick("#tPe"),
      desc: $("#tDesc").value.trim(), overtime: ot, note: ot ? $("#tNote").value.trim() : "",
      dayType: $("#tDay").value, done: $("#tDone").checked,
    });
    const rep = isNew ? $("#tRep").value : "";
    const want = rep ? Math.max(1, Math.min(60, Number($("#tRepN").value) || 1)) : 1;
    let d0 = parseISO(base.date), made = 0, guard = 0;
    while (made < want && guard++ < 500) {
      if (rep !== "wday" || (d0.getDay() >= 1 && d0.getDay() <= 5)) {
        put("tasks", Object.assign({}, base, { id: made === 0 ? t.id : undefined, date: iso(d0) }));
        made++;
      }
      if (!rep) break;
      d0 = addDays(d0, rep === "week" ? 7 : 1);
    }
    close();
  };
}

/* ---- hộp xác nhận riêng: confirm() của trình duyệt bị chặn trong khung nhúng ----
   Hai nút dưới đây khai kiểu thẳng trong thẻ, không dùng lớp .btn hay .modal-f,
   để không quy tắc nào trong bảng kiểu chạm tới được. flex:1 1 0 cho hai nút
   rộng đúng bằng nhau và luôn nằm trong hàng, dù bảng kiểu có ra sao. */
const ASKBTN = "flex:1 1 0;min-width:0;width:auto;padding:9px 14px;border-radius:999px;" +
  "border:1px solid;font:inherit;font-size:13.5px;font-weight:500;line-height:1.3;" +
  "cursor:pointer;white-space:nowrap;overflow:hidden;text-align:center;";
function askConfirm(title, body, okLabel) {
  return new Promise(resolve => {
    const host = document.createElement("div");
    host.innerHTML = `<div class="scrim" data-ask>
      <div class="modal" style="width:min(430px,100%)" role="alertdialog" aria-modal="true">
        <div class="modal-h"><h2>${esc(title)}</h2></div>
        <div class="modal-b"><p style="margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-2)">${esc(body)}</p></div>
        <div style="display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--line)">
          <button type="button" data-no style="${ASKBTN}background:var(--surface);border-color:var(--line-2);color:var(--ink-2)">Giữ lại</button>
          <button type="button" data-yes style="${ASKBTN}background:var(--ot-soft);border-color:var(--ot-line);color:var(--ot)">${esc(okLabel)}</button>
        </div>
      </div></div>`;
    document.body.appendChild(host);
    const done = v => { host.remove(); document.removeEventListener("keydown", onKey); resolve(v); };
    function onKey(e) { if (e.key === "Escape") done(false); }
    document.addEventListener("keydown", onKey);
    host.querySelector("[data-no]").onclick = () => done(false);
    host.querySelector("[data-yes]").onclick = () => done(true);
    host.querySelector("[data-ask]").onclick = e => { if (e.target.hasAttribute("data-ask")) done(false); };
    setTimeout(() => host.querySelector("[data-yes]").focus(), 30);
  });
}

/* ---- xem nhanh việc của một người / công ty / khách hàng ---- */
function openPeek(kind, id) {
  const d = state.cursor;
  const name = kind === "person" ? peName(id) : kind === "company" ? coName(id) : (cl(id) || {}).name || "Khách hàng";
  const field = kind === "person" ? "personId" : kind === "company" ? "companyId" : "clientId";
  const day = state.tasks.filter(t => t[field] === id && t.date === iso(d)).sort((a, b) => toMin(a.start) - toMin(b.start));
  const { from, to } = payRange();
  const period = state.tasks.filter(t => t[field] === id && t.date >= iso(from) && t.date <= iso(to));
  const h = day.reduce((s, t) => s + dur(t), 0);
  const ph = period.reduce((s, t) => s + dur(t), 0);
  const pm = period.reduce((s, t) => s + payOf(t).amount, 0);
  $("#modalHost").innerHTML = `
  <div class="scrim" id="scrim"><div class="modal" style="width:min(660px,100%)" role="dialog" aria-modal="true">
    <div class="modal-h"><h2>${esc(name)}</h2><div class="spacer" style="flex:1"></div>
      <button class="btn icon ghost" id="mCancel" aria-label="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="modal-b">
      <div class="tiles">
        <div class="tile hero"><div class="lbl">Giờ trong ngày</div><div class="v">${fmtH(h)}</div><div class="sub">${dateVN(d)}</div></div>
        <div class="tile"><div class="lbl">Giờ trong kỳ</div><div class="v">${fmtH(ph)}</div><div class="sub">${period.length} nhiệm vụ</div></div>
        <div class="tile"><div class="lbl">Thù lao kỳ</div><div class="v" style="font-size:18px">${vnd(pm)}</div><div class="sub">Theo kỳ đang chọn</div></div>
      </div>
      <div>
        <div class="lbl" style="margin-bottom:6px">Nhiệm vụ ngày ${shortVN(d)}</div>
        ${day.length ? `<div class="daylist">${day.map(rowHTML).join("")}</div>`
      : `<div class="empty"><b>Không có nhiệm vụ nào trong ngày này.</b>Đổi ngày ở màn hình Lịch rồi mở lại.</div>`}
      </div>
    </div>
    <div class="modal-f"><span></span><button class="btn primary" id="mClose2">Đóng</button></div>
  </div></div>`;
  const close = () => { $("#modalHost").innerHTML = ""; };
  $("#mCancel").onclick = close; $("#mClose2").onclick = close;
  $("#scrim").onclick = e => { if (e.target.id === "scrim") close(); };
}

document.addEventListener("click", e => {
  if (swallowClick) { swallowClick = false; return; }   // vừa kéo xong, bỏ qua cú click theo sau

  const go = e.target.closest("[data-go]");
  if (go) {
    state.cursor = parseISO(go.dataset.go);
    state.miniCursor = startOfMonth(state.cursor);
    if (state.view === "cal" && state.calMode === "month") state.calMode = "day";
    savePrefs(); render(); return;
  }
  const mc = e.target.closest("[data-mc]");
  if (mc) {
    const b = startOfMonth(state.miniCursor || state.cursor);
    state.miniCursor = new Date(b.getFullYear(), b.getMonth() + Number(mc.dataset.mc), 1);
    renderMiniCal(); return;
  }

  const ev = e.target.closest("[data-task]");
  if (ev) { const t = state.tasks.find(x => x.id === ev.dataset.task); if (t) openTask(Object.assign({}, t)); return; }
  const slot = e.target.closest(".slot");
  if (slot) {
    const date = slot.closest(".daycol").dataset.date, m = Number(slot.dataset.min);
    openTask({ date, start: fromMin(m), end: fromMin(m + 60), personId: state.me });
    return;
  }
  const more = e.target.closest("[data-day]");
  if (more) { state.cursor = parseISO(more.dataset.day); state.calMode = "week"; savePrefs(); render(); return; }
  const cell = e.target.closest(".mcell");
  if (cell && state.view === "cal" && state.calMode === "month" && !e.target.closest("button")) {
    pending = null; clearGhost();
    openQuick({ date: cell.dataset.date, start: "09:00", end: "17:00" }, cell.getBoundingClientRect());
    return;
  }
  const peek = e.target.closest("[data-peek]");
  if (peek) { const [k, id] = peek.dataset.peek.split(":"); openPeek(k, id); return; }

  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.editco) openCompany(Object.assign({}, co(b.dataset.editco)));
  if (b.dataset.delco) {
    const id = b.dataset.delco;
    askConfirm("Xoá công ty " + coName(id), "Nhiệm vụ cũ của công ty này vẫn còn nhưng mất phần gán công ty, nên không tính ra tiền nữa.", "Xoá công ty")
      .then(ok => { if (ok) drop("companies", id); });
  }
  if (b.dataset.editpe) openPerson(Object.assign({}, pe(b.dataset.editpe)));
  if (b.dataset.delpe) {
    const id = b.dataset.delpe;
    askConfirm("Xoá " + peName(id), "Nhiệm vụ đã gán cho người này sẽ không còn tên người làm.", "Xoá người")
      .then(ok => { if (ok) drop("people", id); });
  }
  if (b.dataset.delhol) {
    const h = state.holidays.find(x => x.id === b.dataset.delhol);
    askConfirm("Xoá ngày lễ", `Bỏ ${h ? esc(h.name) : "ngày này"} khỏi danh sách? Nhiệm vụ hôm đó sẽ tính lại như ngày thường.`, "Xoá ngày lễ")
      .then(ok => { if (ok) drop("holidays", b.dataset.delhol); });
  }
  if (b.dataset.delcl) {
    const id = b.dataset.delcl;
    askConfirm("Xoá khách hàng", "Nhiệm vụ đã gán khách hàng này sẽ không còn tên khách.", "Xoá khách hàng")
      .then(ok => { if (ok) drop("clients", id); });
  }

  switch (b.id) {
    case "ncAdd": {
      const n = $("#ncName").value.trim(); if (!n) return $("#ncName").focus();
      put("companies", {
        name: n, mode: $("#ncMode").value, rate: Number($("#ncRate").value) || 0,
        ot: Number($("#ncOt").value) || 1.5, hpd: 8, color: PALETTE[state.companies.length % PALETTE.length],
      });
      break;
    }
    case "npAdd": {
      const n = $("#npName").value.trim(); if (!n) return $("#npName").focus();
      put("people", { name: n, color: PALETTE[(state.people.length + 2) % PALETTE.length] });
      break;
    }
    case "nhAdd": {
      const d = $("#nhDate").value; if (!d) return $("#nhDate").focus();
      if (holidayOn(d)) return;
      put("holidays", { date: d, name: $("#nhName").value.trim() || "Ngày lễ" });
      break;
    }
    case "nhFill": {
      // Chỉ các ngày lễ cố định theo dương lịch; lễ âm lịch phải thêm tay.
      const y = state.cursor.getFullYear();
      [["01-01", "Tết Dương lịch"], ["04-30", "Ngày Giải phóng miền Nam"],
      ["05-01", "Ngày Quốc tế Lao động"], ["09-02", "Quốc khánh"]]
        .forEach(([md, name]) => { const d = `${y}-${md}`; if (!holidayOn(d)) put("holidays", { date: d, name }); });
      break;
    }
    case "nlAdd": {
      const n = $("#nlName").value.trim(); if (!n) return $("#nlName").focus();
      put("clients", { name: n, companyId: $("#nlCo").value || "" });
      break;
    }
    case "pPrev": case "pNext": {
      const dir = b.id === "pNext" ? 1 : -1, p = state.pay, a = parseISO(p.anchor);
      if (p.kind === "week") p.anchor = iso(addDays(a, dir * 7 * Math.max(1, p.n)));
      else if (p.kind === "month") p.anchor = iso(new Date(a.getFullYear(), a.getMonth() + dir * Math.max(1, p.n), 1));
      else if (p.kind === "year") p.anchor = iso(new Date(a.getFullYear() + dir * Math.max(1, p.n), 0, 1));
      savePrefs(); renderPay(); break;
    }
    case "pNow": state.pay.anchor = iso(new Date()); savePrefs(); renderPay(); break;
    case "pCopy": {
      const rows = payrollRows().rows;
      const txt = rows.map(r => [peName(r.personId), coName(r.companyId), r.basis, r.days.size,
        fmtH(r.base), fmtH(r.otH), fmtH(r.holH), fmtH(r.night), vnd(r.amount)].join("\t")).join("\n");
      navigator.clipboard && navigator.clipboard.writeText(txt).then(
        () => { b.textContent = "Đã sao chép"; setTimeout(() => { b.textContent = "Sao chép bảng"; }, 1600); },
        () => { b.textContent = "Không sao chép được"; });
      break;
    }
    case "expBtn": {
      const data = JSON.stringify({ companies: state.companies, people: state.people, clients: state.clients, tasks: state.tasks }, null, 2);
      (async () => {
        const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
        if (dl) {
          try { await dl.save({ filename: `ca-kip-${iso(new Date())}.json`, data }); b.textContent = "Đã tải xuống"; }
          catch (err) { b.textContent = "Chưa tải được"; }
        } else {
          try { await navigator.clipboard.writeText(data); b.textContent = "Đã chép vào clipboard"; }
          catch (err) { b.textContent = "Chưa tải được"; }
        }
        setTimeout(() => { b.textContent = "Tải xuống bản sao JSON"; }, 1800);
      })();
      break;
    }
    case "demoWipe": case "demoWipe2":
      askConfirm("Xoá dữ liệu mẫu", "Chỉ xoá những dòng mẫu có sẵn. Công ty, người làm, khách hàng và nhiệm vụ do bạn tự thêm vẫn giữ nguyên.", "Xoá dữ liệu mẫu")
        .then(ok => { if (ok) wipeDemo(); });
      break;
    case "wipeBtn":
      askConfirm("Xoá toàn bộ nhiệm vụ", "Mọi nhiệm vụ trên lịch sẽ mất, không lấy lại được. Công ty, người làm và khách hàng vẫn giữ nguyên.", "Xoá hết nhiệm vụ")
        .then(ok => {
          if (!ok) return;
          const ids = state.tasks.map(t => t.id);
          state.tasks = []; render(); saveLocal();
          if (remote) ids.forEach(id => db.collection("tasks").doc(id).delete().catch(() => { }));
        });
      break;
  }
});

document.addEventListener("change", e => {
  // Ô phần trăm trong Thiết lập: nhập 150 thì lưu thành hệ số 1,5.
  if (e.target.classList && e.target.classList.contains("pct")) {
    const c = co(e.target.dataset.co); if (!c) return;
    const v = Math.max(0, Number(e.target.value) || 0) / 100;
    put("companies", Object.assign({}, c, { [e.target.dataset.pct]: v }));
    return;
  }
  const p = state.pay;
  if (e.target.id === "pKind") { p.kind = e.target.value; savePrefs(); renderPay(); }
  if (e.target.id === "pN") { p.n = Math.max(1, Number(e.target.value) || 1); savePrefs(); renderPay(); }
  if (e.target.id === "pAnchor") { p.anchor = e.target.value; savePrefs(); renderPay(); }
  if (e.target.id === "pFrom") { p.from = e.target.value; savePrefs(); renderPay(); }
  if (e.target.id === "pTo") { p.to = e.target.value; savePrefs(); renderPay(); }
  if (e.target.id === "pDone") { p.onlyDone = e.target.checked; savePrefs(); renderPay(); }
});
document.addEventListener("click", e => {
  const g = e.target.closest("#pGroup button[data-g]");
  if (g) { state.pay.group = g.dataset.g; savePrefs(); renderPay(); }
});

/* ---- phím tắt ---- */
document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || $("#modalHost").children.length || quickEl) return;
  if (e.key === "n") { e.preventDefault(); openTask({ date: iso(state.cursor), personId: state.me }); }
  if (e.key === "t") { state.cursor = new Date(); state.miniCursor = startOfMonth(state.cursor); render(); }
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
  const m = { d: "day", w: "week", m: "month" }[e.key];
  if (m) { setView("cal"); state.calMode = m; savePrefs(); render(); }
});

/* ---- khởi động ---- */
(function boot() {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("#themeTxt").textContent = dark ? "Giao diện tối" : "Giao diện sáng";
  const g = $("#grid");
  g.addEventListener("pointerdown", onDown);
  g.addEventListener("pointermove", onMove);
  g.addEventListener("pointerup", onUp);
  g.addEventListener("pointercancel", onCancel);
  g.addEventListener("contextmenu", e => { if (drag) e.preventDefault(); });
  // Chrome khôi phục chỗ cuộn của khung lịch khi tải lại trang: ép về 0h.
  addEventListener("load", () => { if (!drag) g.parentElement.scrollTop = 0; });
  initStore();
  setInterval(() => {
    if (!drag && state.view === "cal" && state.calMode !== "month") renderTimeGrid();
  }, 60000);
})();
</script>
